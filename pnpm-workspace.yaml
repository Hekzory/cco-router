packages:
  - 'packages/*'
  - 'docs'
allowBuilds:
  '@google/genai': true
  '@swc/core': true
  core-js: false
  core-js-pure: false
  esbuild: false
  protobufjs: true
minimumReleaseAgeExclude:
  - tmp@0.2.4 || 0.2.6
  - react-router@7.11.1 || 7.12.0 || 7.12.1 || 7.13.2 || 7.14.0 || 7.14.1 || 7.14.2 || 7.15.0 || 7.18.0
  - undici@6.23.0 || 6.24.0 || 6.27.0 || 7.18.2 || 7.24.0 || 7.28.0
  - diff@4.0.4
  - fastify@5.7.2 || 5.7.3 || 5.8.3 || 5.8.5
  - qs@6.14.1 || 6.14.2 || 6.15.2
  - minimatch@3.1.3 || 3.1.4 || 9.0.6 || 9.0.7
  - rollup@4.59.0
  - serialize-javascript@7.0.3 || 7.0.5
  - ajv@6.14.0 || 8.18.0
  - svgo@3.3.3 || 3.3.4
  - flatted@3.4.0 || 3.4.2
  - path-to-regexp@0.1.13
  - brace-expansion@1.1.13 || 1.1.16 || 2.0.3 || 2.1.2 || 5.0.8
  - node-forge@1.3.4 || 1.4.0
  - picomatch@2.3.2 || 4.0.4
  - dompurify@3.4.13
  - lodash@4.17.23 || 4.17.24
  - vite@7.3.2 || 7.3.5
  - follow-redirects@1.15.12
  - postcss@8.5.10 || 8.5.12 || 8.5.18
  - fast-uri@3.1.1 || 3.1.2 || 3.1.3 || 3.1.4
  - webpack-dev-server@5.2.4 || 5.2.5 || 5.2.6
  - ws@7.5.11 || 8.20.1 || 8.21.0
  - uuid@11.1.1
  - '@babel/plugin-transform-modules-systemjs@7.29.4'
  - shell-quote@1.8.4 || 1.8.5
  - joi@17.13.4
  - esbuild@0.28.1
  - launch-editor@2.14.1
  - http-proxy-middleware@2.0.10
  - js-yaml@4.3.1
  - nanoid@3.3.17
  - websocket-driver@0.7.5
  - '@babel/core@7.29.1'
  - adm-zip@0.6.0
  - body-parser@1.20.6
  - find-my-way@9.6.1
  - '@ai-sdk/gateway@3.0.176 || 3.0.200'
  - '@ai-sdk/react@3.0.261 || 3.0.293'
  - ai@6.0.258 || 6.0.290
  - '@ai-sdk/anthropic@3.0.122'
  - '@ai-sdk/openai@3.0.117'
  - '@ai-sdk/provider-utils@4.0.54'
  - '@cursor/sdk-darwin-arm64@1.0.36'
  - '@cursor/sdk-darwin-x64@1.0.36'
  - '@cursor/sdk-linux-arm64@1.0.36'
  - '@cursor/sdk-linux-x64@1.0.36'
  - '@cursor/sdk-win32-x64@1.0.36'
  - '@cursor/sdk@1.0.36'
overrides:
  # Upstream parents are current but cannot reach these maintained children yet.
  # Keep every compatibility/security bridge scoped to the exact dependency edge.
  'sockjs@0.3.24>uuid': ^11.1.0
  'hast-util-raw@9.1.0>@ungap/structured-clone': ^1.3.3
  # gaxios 8 (via @cursor/sdk / @google/genai) still requests node-fetch 3,
  # whose deprecated dependency chain is unnecessary on the supported Node
  # runtimes; use the native-fetch wrapper. The parent selector stays on the
  # major: a gaxios patch bump silently unmatched the old `7.3.0` pin and let
  # node-fetch 3 (and its deprecated node-domexception chain) back into the
  # tree without pnpm reporting it.
  'gaxios@8>node-fetch': npm:node-fetch-native@^1.6.7
  # @ai-sdk/provider-utils@4.0.54 declares undici ^6.28.0 but never imports it
  # (its fetch path uses globalThis.fetch / safe-node-fetch). Collapse the
  # declared major onto core's maintained undici 8 line to drop the 6.x major.
  '@ai-sdk/provider-utils@4.0.54>undici': ^8.9.0
  # Consolidate narrow patch/minor splits whose newer releases preserve the
  # APIs used by these exact parents. Keep exact edges so unrelated consumers
  # retain their declared compatibility boundaries.
  '@pnpm/network.ca-file@1.0.2>graceful-fs': 4.2.11
  'sitemap@7.1.3>@types/node': 26.6.5
  'p-retry@4.6.2>@types/retry': 0.12.2
  'serve-handler@6.1.7>bytes': 3.1.2
  'accepts@1.3.8>negotiator': 0.6.4
  'readable-stream@2.3.8>safe-buffer': 5.2.1
  'string_decoder@1.1.1>safe-buffer': 5.2.1
  # Transitive security consolidations: every parent range already admits the
  # patched child; the lockfile pin is stale, so scope the resolution to the
  # exact edge instead of letting the old version linger.
  'postcss-colormin@6.1.0>colord': ^2.10.0
  'postcss-minify-gradients@6.0.3>colord': ^2.10.0
  '@svgr/plugin-svgo@8.1.0>svgo': ^3.3.5
  'postcss-svgo@6.0.3>svgo': ^3.3.5
  '@11ty/gray-matter@1.0.0>js-yaml': ^4.3.2
  '@docusaurus/plugin-content-docs@3.10.2>js-yaml': ^4.3.2
  '@docusaurus/utils-validation@3.10.2>js-yaml': ^4.3.2
  '@docusaurus/utils@3.10.2>js-yaml': ^4.3.2
  'cosmiconfig@8.3.6>js-yaml': ^4.3.2
  '@docusaurus/types@3.10.2>joi': ^17.13.8
  '@docusaurus/utils-validation@3.10.2>joi': ^17.13.8
  # @google/genai pins google-auth-library 10 while core depends on 11. The two
  # majors ship a byte-identical build/src — 11.0.0 exists only to raise the
  # Node floor to >=22 (met here) and to take gcp-metadata 9 / logging-utils 2.
  # Sharing core's line collapses all three duplicate pairs at their source.
  '@google/genai@2>google-auth-library': ^11.0.2
  # Docusaurus 3.10.2 is current but its Webpack plugins still pin
  # serialize-javascript 6. Scope the patched major to those exact edges.
  'copy-webpack-plugin@11>serialize-javascript': ^7.0.7
  'css-minimizer-webpack-plugin@5>serialize-javascript': ^7.0.7
  # Monaco 0.56.0 pins DOMPurify 3.4.8; keep the patched 3.4 line local to Monaco.
  'monaco-editor@0.56.0>dompurify': ^3.4.13
  # Docusaurus only needs image-size/fromFile. Replace the archived vulnerable
  # package with a local adapter backed by the maintained probe-image-size parser.
  '@docusaurus/mdx-loader@3.10.2>image-size': link:packages/docusaurus-image-size
  # serve-handler 6.1.7 is current and pins minimatch 3, whose brace-expansion
  # range cannot reach the patched major. Scope the compatibility bridge.
  'minimatch@3.1.5>brace-expansion': ^5.0.8
  # express 4.22.3 / body-parser 1.20.8 pin qs ~6.15.1, which cannot reach the
  # patched 6.16.0 (GHSA-4mjr-xmp4-gh2g array-limit bypass, GHSA-x5fp-wj9c-mxmx
  # isBuffer DoS). express 5 / body-parser 2 already admit ^6. Scope the floor
  # to the two tilde-pinned edges; qs 6.16 preserves the parse/stringify API.
  'express@4.22.3>qs': ^6.16.0
  'body-parser@1.20.8>qs': ^6.16.0
  # fast-uri carries GHSA host-confusion/SSRF advisories on both lines
  # (<3.1.6, <4.1.3). Parents already declare ^ ranges but pnpm retains the
  # locked pins across plain installs, so pin the patched floors explicitly.
  'ajv@8.20.0>fast-uri': ^3.1.8
  '@fastify/ajv-compiler@4.0.7>fast-uri': ^4.1.5
  'fast-json-stringify@7.1.0>fast-uri': ^4.1.5
  # Same-minor-line consolidations (newer release is a strict superset).
  # tailwind node exact-pins lightningcss 1.32.0 while the rest of the tree is
  # on 1.33.0 (all 11 platform binaries published for both). Minor release.
  '@tailwindcss/node@4.3.3>lightningcss': ^1.33.0
  # typography exact-pins postcss-selector-parser 6.0.10; postcss-calc already
  # resolves 6.1.4. Minor release, same API.
  '@tailwindcss/typography@0.5.20>postcss-selector-parser': ^7.1.6
  # postcss-discard-unused 6.0.5 (cssnano-preset-advanced) declares ^6.0.16 and
  # only uses walk/walkAttributes, both present in v7.
  'postcss-discard-unused@6.0.5>postcss-selector-parser': ^7.1.6
  # @docsearch/react 4.7.1 (latest 4.x; even 5.x) exact-pins autocomplete-core
  # 1.19.2 while docusaurus theme-search-algolia resolves 1.19.9. Same-minor
  # patch line; core's ^1.19.2 children (shared, plugin-insights) follow.
  '@docsearch/react@4.7.1>@algolia/autocomplete-core': ^1.19.9
  # Remaining advisory edges (parents pin ranges that cannot reach patched releases).
  # tinypool 1.x carries critical RCE advisories (fixed >=2.1.2); @docusaurus/core
  # declares ^1.0.2. The 2.2.0 surface keeps everything docusaurus uses (default
  # export, run/destroy, filename/min/maxThreads/concurrentTasksPerWorker/runtime/
  # isolateWorkers/workerData/maxMemoryLimitBeforeRecycle options).
  '@docusaurus/core@3.10.2>tinypool': ^2.2.0
  # postcss-calc 9.0.1 pins postcss-selector-parser ^6.0.11; the advisory needs
  # >=7.1.6. calc only uses parser(cb).processSync(value) + walk/type/value/
  # setValue, all present in v7 (7.0.0 changed insert-during-iteration only).
  # The tailwind ^6.1.4 edges above are unaffected (separate intentional line).
  'postcss-calc@9.0.1>postcss-selector-parser': ^7.1.6
  # Same advisory, same preserved surface (parser(cb)/processSync/walk) for the
  # other cssnano 6.x plugins that declare ^6.0.16 and cannot reach 7.x.
  'postcss-minify-selectors@6.0.4>postcss-selector-parser': ^7.1.6
  'postcss-merge-rules@6.1.1>postcss-selector-parser': ^7.1.6
  'postcss-unique-selectors@6.0.4>postcss-selector-parser': ^7.1.6
  'stylehacks@6.1.1>postcss-selector-parser': ^7.1.6
  # Docs/build toolchain stragglers: serve-handler 6.1.7 exact-pins three
  # children, express 4.22.3 / send declare ~1.2.1, and mime-types 2.1.35 /
  # debug 2.6.9 exact-pin data children — all one patch/minor behind the
  # versions already elsewhere in the tree. Same-major updates; the consumers
  # only use the preserved parse/serialize/lookup APIs.
  'serve-handler@6.1.7>content-disposition': ^0.5.4
  'serve-handler@6.1.7>mime-types': ^2.1.35
  'serve-handler@6.1.7>range-parser': ^1.3.0
  'express@4.22.3>range-parser': ^1.3.0
  'send@0.19.2>range-parser': ^1.3.0
  'mime-types@2.1.35>mime-db': ^1.54.0
  'debug@2.6.9>ms': ^2.1.3
