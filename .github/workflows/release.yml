name: Build fork package

on:
  push:
    branches: [master]
    tags: ['v*-hekzory.*']
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fork-package-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'Hekzory/claude-code-router'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      npm_config_ignore_scripts: 'true'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v6
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Build
        run: pnpm build
      - name: Typecheck
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      - name: Test
        run: pnpm test
      - name: Pack CLI
        run: |
          mkdir artifacts
          pnpm --dir packages/cli pack --out ../../artifacts/caeliq-claude-code-router-$(node -p "require('./packages/cli/package.json').version").tgz
          (cd artifacts && sha256sum *.tgz > SHA256SUMS)
      - name: Check clean installation
        run: |
          smoke=$(mktemp -d)
          npm install --prefix "$smoke" --ignore-scripts --no-audit --no-fund "$PWD"/artifacts/*.tgz
          mkdir "$smoke/home"
          version=$(node -p "require('./packages/cli/package.json').version")
          test "$(HOME="$smoke/home" "$smoke/node_modules/.bin/ccr" -v)" = "claude-code-router version: $version"
          node -e 'const fs = require("fs"); const p = process.argv[1]; for (const file of ["cli.js", "tiktoken_bg.wasm", "index.html"]) if (!fs.statSync(`${p}/dist/${file}`).size) process.exit(1)' "$smoke/node_modules/@caeliq/claude-code-router"
      - uses: actions/upload-artifact@v6
        with:
          name: fork-package
          path: artifacts/*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v7
        with:
          name: fork-package
          path: artifacts
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "require('./packages/cli/package.json').version")
          test "$GITHUB_REF_NAME" = "v$version"
          gh release create "$GITHUB_REF_NAME" artifacts/* --verify-tag --title "$GITHUB_REF_NAME" --notes 'Codex replay and protocol conversion fixes.' --latest
